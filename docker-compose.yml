version: '3.9'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: alura_loja
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

